name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:   # build manuel possible depuis l'onglet Actions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "GraphTenantManager" `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            main.py

      - name: Smoke test (import du binaire)
        run: |
          # L'exe se lance-t-il ? (mode windowed → pas de console, on teste l'exit code après 3s)
          $proc = Start-Process -FilePath "dist\GraphTenantManager.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) { throw "EXE crashed with exit code $($proc.ExitCode)" }
            Write-Host "EXE lancé puis fermé proprement"
          } else {
            Write-Host "EXE tourne — OK"
            Stop-Process -Id $proc.Id -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraphTenantManager-windows
          path: dist/GraphTenantManager.exe
          retention-days: 90

      - name: Release sur tag (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GraphTenantManager.exe
          generate_release_notes: true